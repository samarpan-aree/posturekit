[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posturekit"
version = "1.0.0"
description = "External security posture scanner: HTTP security headers, TLS, cookies and DNS email authentication in one pass, with SARIF output for CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samarpan Aree" }]
keywords = ["security", "headers", "tls", "dns", "dmarc", "devsecops", "cli", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
posturekit = "posturekit.cli:main"

[project.urls]
Homepage = "https://github.com/samarpan-aree/posturekit"
Issues = "https://github.com/samarpan-aree/posturekit/issues"

[tool.setuptools]
packages = ["posturekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
